<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dew Point & Relative Humidity Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :focus-visible { outline: 3px solid #22d3ee; outline-offset: 2px; }
  </style>
</head>
<body class="bg-sky-50 min-h-screen">
  <div class="max-w-2xl mx-auto px-4 py-8">
    <header class="mb-8 text-center">
      <div class="text-4xl mb-2" aria-hidden="true">💧</div>
      <h1 class="text-3xl font-bold text-sky-900">Dew Point & Humidity Calculator</h1>
      <p class="text-sky-700 mt-2">Solve for any variable using the Magnus formula. Enter any two values.</p>
    </header>

    <!-- Unit toggle -->
    <div class="flex justify-center mb-6">
      <div class="flex rounded-lg overflow-hidden border border-sky-300">
        <button id="btnC" onclick="setUnit('C')"
          class="px-6 py-2 text-sm font-medium bg-sky-600 text-white focus:ring-2 focus:ring-sky-400" aria-pressed="true">°C</button>
        <button id="btnF" onclick="setUnit('F')"
          class="px-6 py-2 text-sm font-medium bg-white text-sky-700 focus:ring-2 focus:ring-sky-400" aria-pressed="false">°F</button>
      </div>
    </div>

    <div class="bg-white rounded-xl shadow p-6 mb-6">
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
        <!-- Temperature -->
        <div>
          <label for="tempInput" class="block text-sm font-medium text-gray-700 mb-1">
            Temperature (<span class="unitLabel">°C</span>)
          </label>
          <div class="flex gap-2">
            <input type="number" id="tempInput" value="25" step="0.1"
              class="flex-1 border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-cyan-400 focus:border-transparent"
              aria-describedby="tempSolveHint" />
            <button onclick="setSolveFor('temp')" id="solveTemp"
              class="px-3 py-2 rounded-lg text-xs font-medium border border-gray-300 hover:bg-cyan-100 focus:ring-2 focus:ring-cyan-400 transition-colors"
              aria-label="Solve for temperature">Solve</button>
          </div>
          <p id="tempSolveHint" class="text-xs text-gray-400 mt-1">Click Solve to calculate this value</p>
        </div>
        <!-- Relative Humidity -->
        <div>
          <label for="rhInput" class="block text-sm font-medium text-gray-700 mb-1">Relative Humidity (%)</label>
          <div class="flex gap-2">
            <input type="number" id="rhInput" value="60" min="0" max="100" step="1"
              class="flex-1 border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-cyan-400 focus:border-transparent" />
            <button onclick="setSolveFor('rh')" id="solveRH"
              class="px-3 py-2 rounded-lg text-xs font-medium border border-gray-300 hover:bg-cyan-100 focus:ring-2 focus:ring-cyan-400 transition-colors"
              aria-label="Solve for relative humidity">Solve</button>
          </div>
        </div>
        <!-- Dew Point -->
        <div>
          <label for="dpInput" class="block text-sm font-medium text-gray-700 mb-1">
            Dew Point (<span class="unitLabel">°C</span>)
          </label>
          <div class="flex gap-2">
            <input type="number" id="dpInput" value="" step="0.1"
              class="flex-1 border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-cyan-400 focus:border-transparent"
              placeholder="—" />
            <button onclick="setSolveFor('dp')" id="solveDP"
              class="px-3 py-2 rounded-lg text-xs font-medium border border-gray-300 hover:bg-cyan-100 focus:ring-2 focus:ring-cyan-400 transition-colors"
              aria-label="Solve for dew point">Solve</button>
          </div>
        </div>
      </div>

      <button onclick="calculate()"
        class="mt-6 w-full bg-sky-600 hover:bg-sky-700 text-white font-semibold py-2.5 rounded-lg transition-colors focus:ring-2 focus:ring-offset-2 focus:ring-sky-500">
        Calculate
      </button>
    </div>

    <!-- Results -->
    <div id="results" class="hidden bg-white rounded-xl shadow p-6 space-y-4">
      <div id="comfortBanner" class="rounded-xl p-5 text-center">
        <div id="comfortEmoji" class="text-4xl mb-2"></div>
        <div id="comfortLabel" class="text-xl font-bold"></div>
        <div id="comfortDesc" class="text-sm mt-1"></div>
      </div>
      <div class="grid grid-cols-3 gap-4 text-center text-sm">
        <div class="bg-gray-50 rounded-lg p-3">
          <div class="text-gray-500 text-xs uppercase tracking-wide mb-1">Temperature</div>
          <div id="resTemp" class="font-bold text-lg text-gray-900"></div>
        </div>
        <div class="bg-gray-50 rounded-lg p-3">
          <div class="text-gray-500 text-xs uppercase tracking-wide mb-1">Relative Humidity</div>
          <div id="resRH" class="font-bold text-lg text-gray-900"></div>
        </div>
        <div class="bg-gray-50 rounded-lg p-3">
          <div class="text-gray-500 text-xs uppercase tracking-wide mb-1">Dew Point</div>
          <div id="resDP" class="font-bold text-lg text-gray-900"></div>
        </div>
      </div>
      <div class="bg-sky-50 rounded-lg p-4 text-xs font-mono text-sky-900">
        <div class="font-semibold mb-1 text-sky-700">Magnus Formula</div>
        <div>γ(T,RH) = ln(RH/100) + (17.625·T)/(243.04+T)</div>
        <div>T_dp = 243.04·γ / (17.625−γ)</div>
      </div>
    </div>
  </div>

  <script>
    let unit = 'C';
    let solveFor = 'dp';

    const COMFORT = [
      { maxDp: 10,  label: 'Dry & Crisp',    desc: 'Very comfortable — low humidity.',  emoji: '🌵', bg: 'bg-yellow-100', text: 'text-yellow-800' },
      { maxDp: 15,  label: 'Comfortable',    desc: 'Pleasant conditions.',              emoji: '😊', bg: 'bg-green-100',  text: 'text-green-800' },
      { maxDp: 18,  label: 'Slightly Muggy', desc: 'Noticeable but not uncomfortable.', emoji: '🙂', bg: 'bg-lime-100',   text: 'text-lime-800' },
      { maxDp: 21,  label: 'Muggy',          desc: 'Sticky and humid.',                 emoji: '😅', bg: 'bg-amber-100',  text: 'text-amber-800' },
      { maxDp: 24,  label: 'Very Humid',     desc: 'Oppressive for outdoor activity.',  emoji: '🥵', bg: 'bg-orange-100', text: 'text-orange-800' },
      { maxDp: 999, label: 'Oppressive',     desc: 'Dangerously uncomfortable.',        emoji: '😰', bg: 'bg-red-100',    text: 'text-red-800' },
    ];

    function setUnit(u) {
      unit = u;
      document.getElementById('btnC').classList.toggle('bg-sky-600', u === 'C');
      document.getElementById('btnC').classList.toggle('text-white', u === 'C');
      document.getElementById('btnC').classList.toggle('bg-white', u !== 'C');
      document.getElementById('btnC').classList.toggle('text-sky-700', u !== 'C');
      document.getElementById('btnF').classList.toggle('bg-sky-600', u === 'F');
      document.getElementById('btnF').classList.toggle('text-white', u === 'F');
      document.getElementById('btnF').classList.toggle('bg-white', u !== 'F');
      document.getElementById('btnF').classList.toggle('text-sky-700', u !== 'F');
      document.querySelectorAll('.unitLabel').forEach(el => el.textContent = u === 'C' ? '°C' : '°F');
    }

    function setSolveFor(field) {
      solveFor = field;
      ['temp','rh','dp'].forEach(f => {
        const btn = document.getElementById('solve' + f.charAt(0).toUpperCase() + f.slice(1));
        btn.classList.toggle('bg-cyan-500', f === field);
        btn.classList.toggle('text-white', f === field);
        btn.classList.toggle('border-cyan-500', f === field);
      });
    }

    function toC(v) { return unit === 'F' ? (v - 32) * 5/9 : v; }
    function fromC(v) { return unit === 'F' ? v * 9/5 + 32 : v; }
    function dp_celsius(T_c, rh) {
      const g = Math.log(rh / 100) + (17.625 * T_c) / (243.04 + T_c);
      return (243.04 * g) / (17.625 - g);
    }
    function rh_from_TDP(T_c, dp_c) {
      return 100 * Math.exp((17.625 * dp_c) / (243.04 + dp_c) - (17.625 * T_c) / (243.04 + T_c));
    }
    function T_from_RHDP(rh, dp_c) {
      const g = Math.log(rh / 100) + (17.625 * dp_c) / (243.04 + dp_c);
      return (243.04 * g) / (17.625 - g);
    }

    function calculate() {
      const tempRaw = parseFloat(document.getElementById('tempInput').value);
      const rhRaw   = parseFloat(document.getElementById('rhInput').value);
      const dpRaw   = parseFloat(document.getElementById('dpInput').value);

      let T_c, rh, dp_c;

      if (solveFor === 'dp') {
        T_c = toC(tempRaw); rh = rhRaw;
        if (isNaN(T_c) || isNaN(rh) || rh < 0 || rh > 100) { alert('Enter valid Temperature and RH.'); return; }
        dp_c = dp_celsius(T_c, rh);
        document.getElementById('dpInput').value = fromC(dp_c).toFixed(1);
      } else if (solveFor === 'rh') {
        T_c = toC(tempRaw); dp_c = toC(dpRaw);
        if (isNaN(T_c) || isNaN(dp_c)) { alert('Enter valid Temperature and Dew Point.'); return; }
        rh = rh_from_TDP(T_c, dp_c);
        document.getElementById('rhInput').value = Math.max(0, Math.min(100, rh)).toFixed(1);
      } else {
        rh = rhRaw; dp_c = toC(dpRaw);
        if (isNaN(rh) || isNaN(dp_c) || rh < 0 || rh > 100) { alert('Enter valid RH and Dew Point.'); return; }
        T_c = T_from_RHDP(rh, dp_c);
        document.getElementById('tempInput').value = fromC(T_c).toFixed(1);
      }

      // Comfort scale uses °C dew point
      const comfort = COMFORT.find(c => dp_c <= c.maxDp) || COMFORT[COMFORT.length - 1];
      const banner = document.getElementById('comfortBanner');
      banner.className = `rounded-xl p-5 text-center ${comfort.bg}`;
      document.getElementById('comfortEmoji').textContent = comfort.emoji;
      document.getElementById('comfortLabel').className = `text-xl font-bold ${comfort.text}`;
      document.getElementById('comfortLabel').textContent = comfort.label;
      document.getElementById('comfortDesc').className = `text-sm mt-1 ${comfort.text}`;
      document.getElementById('comfortDesc').textContent = comfort.desc;

      const fmt = v => v.toFixed(1) + (unit === 'F' ? ' °F' : ' °C');
      document.getElementById('resTemp').textContent = fmt(fromC(T_c));
      document.getElementById('resRH').textContent   = Math.max(0, Math.min(100, rh)).toFixed(1) + '%';
      document.getElementById('resDP').textContent   = fmt(fromC(dp_c));

      document.getElementById('results').classList.remove('hidden');
    }

    setSolveFor('dp');
    calculate();
  </script>
</body>
</html>
